[toolchain]

[features]
resolution = true
skip-lint = false

[programs.devnet]
sss_1 = "SSS1111111111111111111111111111111111111111"
sss_2 = "SSS2222222222222222222222222222222222222222"
sss_transfer_hook = "SSSHook111111111111111111111111111111111111"

[programs.localnet]
sss_1 = "SSS1111111111111111111111111111111111111111"
sss_2 = "SSS2222222222222222222222222222222222222222"
sss_transfer_hook = "SSSHook111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Run all tests: anchor test
# Run specific file: anchor test -- tests/sss-1.ts
# Run by preset: anchor test -- \"tests/sss-*.ts\"
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000"
