[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", default-features = false, features = ["token", "token_2022", "associated_token"] }
spl-token-2022 = { version = "4.0.0", features = ["no-entrypoint"] }
spl-tlv-account-resolution = { version = "0.7.0" }
spl-transfer-hook-interface = { version = "0.7.0" }

[patch.crates-io]
blake3 = { path = "vendor/blake3" }
constant_time_eq = { path = "vendor/constant_time_eq" }
solana-zk-token-sdk = { path = "vendor/solana-zk-token-sdk" }
